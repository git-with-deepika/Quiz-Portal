<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuizApp</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="quiz.css">
  <script src="common.js"></script>
</head>
<body>
  <div id="header-include"></div>

  <main class="max-w-3xl mx-auto p-4">
    <div id="welcome">
      <h1 class="text-2xl font-semibold mb-2">Welcome to QuizApp</h1>
      <p>Pick a topic from <a class="text-indigo-700 underline" href="topics.html">Topics</a> to start.</p>
    </div>

    <div id="subtopics" class="hidden">
      <h1 id="topic-title" class="text-2xl font-semibold mb-4"></h1>
      <div id="subtopics-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      <p class="mt-4"><a class="text-indigo-700 underline" href="topics.html">← Back to Topics</a></p>
    </div>
  </main>

  <div id="footer-include"></div>

  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const topicSlug = params.get('topic');
      if (!topicSlug) return; // plain welcome page, nothing else to do

      document.getElementById('welcome').classList.add('hidden');
      const subtopicsEl = document.getElementById('subtopics');
      const listEl = document.getElementById('subtopics-list');
      const titleEl = document.getElementById('topic-title');
      subtopicsEl.classList.remove('hidden');
      titleEl.textContent = 'Loading…';

      try {
        const res = await fetch(`${API_BASE}/api/quiz/topics/${encodeURIComponent(topicSlug)}`);
        if (!res.ok) throw new Error('Topic not found');
        const topic = await res.json();

        titleEl.textContent = `${topic.name} — Choose a Sub-topic`;

        if (!topic.subtopics || !topic.subtopics.length) {
          listEl.innerHTML = '<p class="text-gray-600">No sub-topics available yet.</p>';
          return;
        }

        listEl.innerHTML = topic.subtopics.map(s => `
          <a class="block border rounded p-4 hover:bg-gray-50 bg-white"
             href="sets.html?topic=${encodeURIComponent(topic.slug)}&subtopic=${encodeURIComponent(s.slug)}">
            <div class="text-lg font-medium">${s.name}</div>
            <div class="text-gray-500 text-sm">${(s.sets || []).length} set(s)</div>
          </a>
        `).join('');
      } catch (e) {
        titleEl.textContent = 'Topic not found';
        listEl.innerHTML = `<p class="text-red-600">${e.message}</p>`;
      }
    })();
  </script>
</body>
</html>
