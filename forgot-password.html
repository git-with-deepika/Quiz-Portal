<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password – QuizApp</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="quiz.css">
  <script src="common.js"></script>
</head>
<body data-public="true">
  <div id="header-include"></div>

  <main class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-semibold mb-4">Forgot Password</h1>
    <form id="fpForm" class="space-y-3">
      <input id="email" type="email" class="w-full border rounded px-3 py-2" placeholder="Your email" required>
      <button class="w-full py-2 rounded bg-indigo-600 text-white">Send reset link</button>
      <p id="msg" class="text-sm mt-2"></p>
    </form>
  </main>

  <div id="footer-include"></div>

  <script>
    document.getElementById('fpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg');
      msg.textContent = '';
      try {
        const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        msg.textContent = data.message || 'If the email exists, a reset link was sent';
      } catch {
        msg.textContent = 'Server error';
      }
    });
  </script>
</body>
</html>
