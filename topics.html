<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topics – QuizApp</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="quiz.css">
  <script src="common.js"></script>
</head>
<body>
  <div id="header-include"></div>

  <main class="max-w-5xl mx-auto p-4">
    <h1 class="text-2xl font-semibold mb-4">Topics</h1>
    <div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <div id="footer-include"></div>

  <script>
    (async function load() {
      const res = await fetch(`${API_BASE}/api/quiz/topics`);
      const list = document.getElementById('list');
      if (!res.ok) { list.innerHTML = '<p class="text-red-600">Failed to load topics.</p>'; return; }
      const data = await res.json();
      list.innerHTML = data.map(t => `
        <a class="block border rounded p-4 hover:bg-gray-50" href="index.html?topic=${encodeURIComponent(t.slug)}">
          <div class="text-lg font-medium">${t.name}</div>
          <div class="text-gray-600 text-sm">${t.slug}</div>
        </a>
      `).join('');
    })();
  </script>
</body>
</html>
