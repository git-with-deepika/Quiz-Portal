<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password – QuizApp</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="quiz.css">
  <script src="common.js"></script>
</head>
<body data-public="true">
  <div id="header-include"></div>

  <main class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-semibold mb-4">Reset Password</h1>
    <form id="rpForm" class="space-y-3">
      <input type="password" id="newPassword" minlength="6" class="w-full border rounded px-3 py-2" placeholder="New password" required>
      <input type="password" id="confirmPassword" minlength="6" class="w-full border rounded px-3 py-2" placeholder="Confirm new password" required>
      <button id="rpBtn" class="w-full py-2 rounded bg-indigo-600 text-white" type="submit">Reset password</button>
      <p id="message" class="text-sm mt-2"></p>
    </form>
  </main>

  <div id="footer-include"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const email = params.get('email');
    const msg = document.getElementById('message');

    if (!token || !email) {
      msg.textContent = 'This reset link is invalid or incomplete. Please request a new one.';
      msg.className = 'text-sm mt-2 text-red-600';
      document.getElementById('rpBtn').disabled = true;
    }

    document.getElementById('rpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      msg.textContent = '';

      if (newPassword.length < 6) {
        msg.textContent = 'Password must be at least 6 characters.';
        msg.className = 'text-sm mt-2 text-red-600';
        return;
      }
      if (newPassword !== confirmPassword) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'text-sm mt-2 text-red-600';
        return;
      }

      const btn = document.getElementById('rpBtn');
      btn.disabled = true;
      btn.textContent = 'Resetting...';
      try {
        const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, password: newPassword })
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || 'Could not reset password.';
          msg.className = 'text-sm mt-2 text-red-600';
          return;
        }
        msg.textContent = (data.message || 'Password reset successfully.') + ' Redirecting to login...';
        msg.className = 'text-sm mt-2 text-green-600';
        setTimeout(() => (window.location.href = 'login.html'), 1500);
      } catch {
        msg.textContent = 'Server error. Please try again.';
        msg.className = 'text-sm mt-2 text-red-600';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
