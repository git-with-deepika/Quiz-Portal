<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings – QuizApp</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="quiz.css">
  <script src="common.js"></script>
</head>
<body>
  <div id="header-include"></div>

  <main class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-semibold mb-4">Settings</h1>

    <section class="bg-white border rounded p-4">
      <h2 class="text-lg font-medium mb-3">Change Password</h2>
      <form id="pwForm" class="space-y-3">
        <input id="currentPassword" type="password" class="w-full border rounded px-3 py-2" placeholder="Current password" required>
        <input id="newPassword" type="password" minlength="6" class="w-full border rounded px-3 py-2" placeholder="New password" required>
        <input id="confirmPassword" type="password" minlength="6" class="w-full border rounded px-3 py-2" placeholder="Confirm new password" required>
        <button id="pwBtn" class="w-full py-2 rounded bg-indigo-600 text-white hover:bg-indigo-700" type="submit">Update password</button>
        <p id="pwMsg" class="text-sm mt-2"></p>
      </form>
    </section>

    <p class="mt-4"><a href="index.html" class="text-indigo-700 underline">← Home</a></p>
  </main>

  <div id="footer-include"></div>

  <script>
    document.getElementById('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('pwMsg');
      msg.textContent = '';

      if (newPassword.length < 6) {
        msg.textContent = 'New password must be at least 6 characters.';
        msg.className = 'text-sm mt-2 text-red-600';
        return;
      }
      if (newPassword !== confirmPassword) {
        msg.textContent = 'New password and confirmation do not match.';
        msg.className = 'text-sm mt-2 text-red-600';
        return;
      }

      const btn = document.getElementById('pwBtn');
      btn.disabled = true;
      btn.textContent = 'Updating...';
      try {
        const res = await fetch(`${API_BASE}/api/auth/change-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword, newPassword })
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || 'Could not update password.';
          msg.className = 'text-sm mt-2 text-red-600';
          return;
        }
        msg.textContent = data.message || 'Password updated.';
        msg.className = 'text-sm mt-2 text-green-600';
        document.getElementById('pwForm').reset();
      } catch {
        msg.textContent = 'Server error. Please try again.';
        msg.className = 'text-sm mt-2 text-red-600';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
