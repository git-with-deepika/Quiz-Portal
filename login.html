<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – QuizApp</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="quiz.css">
  <script src="common.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-pink-100 min-h-screen flex flex-col" data-public="true">
  <div id="header-include"></div>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white/80 backdrop-blur rounded-xl shadow p-6">
      <h1 class="text-2xl font-semibold mb-4 text-center">Login</h1>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input id="email" type="email" class="w-full border rounded px-3 py-2" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <input id="password" type="password" class="w-full border rounded px-3 py-2" required>
        </div>
        <button id="loginBtn" type="submit" class="w-full py-2 rounded bg-indigo-600 text-white hover:bg-indigo-700">Sign in</button>
        <p class="text-right text-sm mt-2"><a class="text-indigo-700 hover:underline" href="forgot-password.html">Forgot password?</a></p>
        <p id="msg" class="text-sm text-red-600 mt-2"></p>
      </form>
    </div>
  </main>

  <div id="footer-include"></div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      msg.textContent = '';
      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok || !data.token) {
          msg.textContent = data.error || 'Login failed';
          return;
        }
        localStorage.setItem('token', data.token);
        window.location.href = 'topics.html';
      } catch {
        msg.textContent = 'Server error';
      }
    });
  </script>
</body>
</html>
